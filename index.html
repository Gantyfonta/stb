function burst(x,y,n,c){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=1+Math.random()*4;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:18+Math.random()*14,c,s:2+Math.random()*3})}}

  }

 for(let i=0;i<36;i++){const a=Math.random()*6.28,v=2+Math.random()*7;PT.push({x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:30+Math.random()*30,c:i%3?p.ch.c:'#fff',s:3+Math.random()*5})}

 const al=FT.filter(q=>q.st>0);if(al.length<=1){win=al[0]||null;S='over'}}

function step(){
 fr++;shake*=.88;const st=ST[stage];
 for(const p of FT){if(p.st<=0)continue;
  const k=p.ai?aiK(p):inp(p),e={u:k.u&&!p.pk.u,d:k.d&&!p.pk.d,L:k.L&&!p.pk.L,S:k.S&&!p.pk.S};p.pk=k;
  if(e.L)p.bl=8;if(e.S)p.bs=8;
  if(p.dead>0){if(--p.dead==0){p.x=488;p.y=40;p.vx=p.vy=0;p.inv=150;p.jumps=1;p.usedUp=false;p.aird=0;p.airInv=0;p.combo=0;p.comboT=0}continue}
  if(p.lag>0){p.lag--;continue}
  if(p.bl>0)p.bl--;if(p.bs>0)p.bs--;if(p.inv>0)p.inv--;if(p.airInv>0)p.airInv--;if(p.comboT>0){p.comboT--;if(p.comboT==0)p.combo=0}
  p.drop=k.d&&p.on?10:Math.max(0,p.drop-1);
  const dx=k.r-k.l;
  if(p.hs>0){p.hs--;p.vx*=.985}
  else if(p.atk)runAtk(p,k);
  else{
   if(dx)p.face=dx;
   p.vx+=(dx*p.ch.spd-p.vx)*(p.on?.25:.1);
   if(p.on){p.jumps=1;p.usedUp=false;p.aird=0}
   // ULTIMATE ACTIVATION
   if(p.bl>0&&p.bs>0&&p.um>=100&&!p.aird){
    p.bl=p.bs=0;p.um=0;p.atk={m:p.moveset['ULT'],t:0,h:new Set(),key:'ULT'};
    p.vx*=.2;p.vy*=.2;shake=15;burst(p.x+12,p.y+12,30,p.ch.c);
   }
   else if(p.bl>0||p.bs>0){const lt=p.bl>0,key=lt?(k.u?'UL':k.d?'DL':dx?'SL':'L'):(k.u?'US':k.d?'DS':dx?'SS':'S');
    p.bl=p.bs=0;if(!(key=='US'&&p.usedUp)){p.atk={m:p.moveset[key],t:0,h:new Set(),key};p.vx*=.5}}
   else if(e.L&&e.u&&!p.on&&!p.aird){p.aird=1;p.airInv=18;p.vy=-2.5;p.vx=-p.face*7;p.lag=3} else if(e.u){if(p.on){p.vy=-p.ch.jmp;p.on=false}else if(p.jumps>0){p.vy=-p.ch.jmp*.9;p.jumps--;burst(p.x+12,p.y+24,5,'#e5f7c8')}}}
  const ff=!p.on&&k.d&&p.vy>0&&!p.atk&&p.hs<=0;
  p.vy=Math.min(p.vy+.5,p.hs>0?24:ff?13:9.5);
  if(p.on&&!p.hs&&!dx&&!p.atk)p.vx*=.8;if(p.on&&p.atk&&p.atk.m.t!=2)p.vx*=.82;if(p.on&&p.hs>0)p.vx*=.9;
  collide(p,st.s,st.o);
  if(p.x<-110||p.x>W+90||p.y<-200||p.y>H+130)ko(p)}

 // FIXED: Separated height `q.h` from hitSet `q.hits` to fix q.h.has is not a function
 for(const q of PR){q.x+=q.vx;q.y+=(q.vy||0);q.life--;if(q.kind==='grenade')q.vy=(q.vy||0)+.35;
  for(const o of FT)if(o!==q.own&&alive(o)&&o.inv<=0&&o.airInv<=0&&ov(q,o)){
   if(q.hits&&q.hits.has(o))continue;if(q.hits)q.hits.add(o);
   if(q.kind==='grenade'){burst(q.x+6,q.y+6,14,q.own.ch.c);for(const z of FT)if(z!==q.own&&alive(z)&&z.inv<=0&&Math.hypot(z.x-q.x,z.y-q.y)<70)dmg(z,q.own,{d:8,b:8,g:.5,an:55},Math.sign(z.x-q.x)||q.own.face);}
   else dmg(o,q.own,q.m,Math.sign(q.vx)||q.own.face);
   if(q.kind!=='crescent'&&q.kind!=='blast'&&q.kind!=='grenade')q.life=0;if(q.kind==='grenade')q.life=0;
  }
  if(st.s.some(s=>ov(q,{x:s[0],y:s[1],w:s[2],h:s[3]}))){
      if(q.kind==='grenade'){burst(q.x+6,q.y+6,14,q.own.ch.c);q.life=0;}
      else if(q.kind!=='crescent'&&q.kind!=='blast')q.life=0;
  }
 }
 PR=PR.filter(q=>q.life>0&&q.x>-60&&q.x<W+60&&q.y>-80&&q.y<H+100);
 for(const q of PT){q.x+=q.vx;q.y+=q.vy;q.vy+=.1;q.l--}PT=PT.filter(q=>q.l>0)}

// ---------- drawing ----------
function drawF(p){if(p.st<=0||p.dead>0)return;if(p.inv>0&&fr%6<3)return;
 const a=p.atk;ctx.save();ctx.translate(p.x+12,p.y+12);
 if(p.hs>0)ctx.rotate(fr*.35*(p.vx<0?-1:1));else if(a&&a.t<a.m.s)ctx.rotate(-p.face*.15);
 if(p.um>=100&&fr%10<5){ctx.strokeStyle='#ffeb3b';ctx.lineWidth=3;ctx.strokeRect(-15,-15,30,30)} // ULT Aura

 const f=p.face*1.5;

 // Custom Visuals per Class
 if(p.msName==='SWORDFIGHTER'){
  // Red Scarf / Headband
  ctx.fillStyle='#e74c3c';
  ctx.fillRect(-p.face*8-4,-10,8,4);
  // Armor plate
  rr(-12,-12,24,24,p.ch.c,'#1a0f0a',2);
  ctx.fillStyle='#ecf0f1';
  ctx.fillRect(-6,-4,12,8);
  // Sword geometry in hand
  ctx.save();
  const swordAng = a ? (p.face * (a.t / (a.m.s + a.m.a)) * 2.2 - 0.8) : (p.face * 0.4);
  ctx.translate(p.face * 8, 2);
  ctx.rotate(swordAng);
  ctx.fillStyle = '#d35400'; ctx.fillRect(-2, -2, 4, 4); // Hilt
  ctx.fillStyle = '#f1c40f'; ctx.fillRect(-5, -4, 10, 3); // Guard
  ctx.fillStyle = '#ecf0f1';
  ctx.beginPath(); ctx.moveTo(-2,-4); ctx.lineTo(0,-20); ctx.lineTo(2,-4); ctx.closePath(); ctx.fill(); ctx.stroke(); // Blade
  ctx.restore();
 } else if(p.msName==='GRAPPLER'){
  // Bulky Body & Spiked Shoulders
  rr(-14,-14,28,28,p.ch.c,'#1a0f0a',2.5);
  ctx.fillStyle='#34495e';
  ctx.fillRect(-16,-15,8,8); ctx.fillRect(8,-15,8,8); // Spiked shoulders
  ctx.fillStyle='#e67e22';
  ctx.fillRect(-14+f*2,2,8,8); ctx.fillRect(6+f*2,2,8,8); // Heavy Gauntlets
  ctx.fillStyle='#f1c40f'; ctx.fillRect(-4,4,8,6); // Gold Belt
 } else {
  // Standard Fighter Base
  rr(-12,-12,24,24,p.ch.c,'#1a0f0a',2);
 }

 ctx.fillStyle='#1a0f0a';
 if(p.hs>0){ctx.strokeStyle='#1a0f0a';ctx.lineWidth=2;for(const ex of[-6,3]){ctx.beginPath();ctx.moveTo(ex,-6);ctx.lineTo(ex+4,-2);ctx.moveTo(ex+4,-6);ctx.lineTo(ex,-2);ctx.stroke()}ctx.fillRect(-3,4,6,4)}
 else{ctx.fillRect(-6+f,-6,3,5);ctx.fillRect(3+f,-6,3,5);if(a){ctx.fillRect(-7+f,-9,5,2);ctx.fillRect(2+f,-9,5,2);ctx.fillRect(-3,5,6,4)}else ctx.fillRect(-3,6,6,1)}
 ctx.restore()}

function drawAtk(p){const a=p.atk;if(!a||a.t<a.m.s||a.t>=a.m.s+a.m.a||(a.m.t==1&&a.key!=='ULT'))return;const m=a.m,b=hb(p,m);
 ctx.save();
 if(p.msName==='SWORDFIGHTER'){
  // Sword Slash Arcs
  ctx.strokeStyle='#a0e0ff'; ctx.lineWidth=4;
  ctx.fillStyle='rgba(160, 224, 255, 0.45)';
  ctx.beginPath();
  ctx.ellipse(b.x+b.w/2, b.y+b.h/2, b.w/2, b.h/2, p.face*0.2, 0, 7);
  ctx.fill(); ctx.stroke();
 } else if(p.msName==='GRAPPLER'){
  // Heavy Impact / Seismic Brackets
  ctx.strokeStyle='#e74c3c'; ctx.lineWidth=5;
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle='rgba(231, 76, 60, 0.35)';
  ctx.fillRect(b.x, b.y, b.w, b.h);
 } else {
  // Standard Attack Hitbox
  let mk=p.msName==='GUNMAN'?'#fb2':'#fff';
  ctx.globalAlpha=.4;ctx.fillStyle=mk;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.globalAlpha=1;
  const hx=m.u||m.dn?b.x+b.w/2-6:p.face>0?b.x+b.w-12:b.x,hy=m.u?b.y:m.dn?b.y+b.h-8:b.y+b.h/2-7;
  for(const o of m.u?[-9,3]:m.dn?[-9,3]:[-8,1]){rr(m.u||m.dn?hx+o+3:hx,m.u?hy:m.dn?hy:hy+o+4,12,8,'#ffd9a8','#1a0f0a',1.5)}
 }
 ctx.restore();
}

function drawGame(){
 ctx.save();if(shake>.5)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 bg();const st=ST[stage];
 for(const s of st.s){rr(s[0],s[1],s[2],s[3],'#39231a');rr(s[0],s[1],s[2],4,'#5d8f3a')}
 for(const s of st.o){rr(s[0],s[1],s[2],s[3],'#39231a');rr(s[0],s[1],s[2],2,'#54382a')}
 for(const q of PR){
  ctx.fillStyle=q.own.ch.c;
  if(q.kind==='crescent'){
   ctx.fillStyle='#8ce';ctx.beginPath();ctx.ellipse(q.x+q.w/2,q.y+q.h/2,q.w/2,q.h/2,0,0,7);ctx.fill();
  }else if(q.kind==='blast'){
   ctx.globalAlpha=0.8;ctx.beginPath();ctx.arc(q.x+q.w/2,q.y+q.h/2,q.w/2,0,7);ctx.fill();ctx.globalAlpha=1;
  }else{
   ctx.strokeStyle='#fff';ctx.lineWidth=q.kind==='grenade'?2:3;
   ctx.beginPath();ctx.arc(q.x+q.w/2,q.y+q.h/2,(q.w/2)*(1+.1*Math.sin(fr/2)),0,7);ctx.fill();ctx.stroke();
  }
 }
 for(const p of FT){drawF(p);drawAtk(p);
  if(alive(p)){const y=p.y-12+Math.sin(fr/8)*2;ctx.fillStyle=p.ch.c;ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+6,y-8);ctx.lineTo(p.x+18,y-8);ctx.lineTo(p.x+12,y);ctx.closePath();ctx.fill();ctx.stroke()}}
 for(const q of PT){ctx.globalAlpha=Math.min(1,q.l/15);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,q.s,q.s)}ctx.globalAlpha=1;
 ctx.restore();
 FT.forEach((p,n)=>{const x=100+n*200,pc=Math.min(1,p.pct/180),col='rgb(255,'+Math.round(255-pc*200)+','+Math.round(255-pc*220)+')';
  rr(x-96,452,192,84,'rgba(0,0,0,.35)','#000',3);rr(x-92,458,18,18,p.ch.c,'#000',2);tx(p.ch.n+(p.ai?' CPU':''),x-68,467,9,'#fff','#000',4,'left');
  tx(Math.floor(p.pct)+'%',x,497,28+Math.min(8,p.pct/25),p.st>0?col:'#777','#000',8);
  for(let i=0;i<p.st;i++)rr(x-88+i*16,512,11,11,p.ch.c,'#000',2);
  if(p.st>0){ // HUD UM Meter
   rr(x-88, 528, 100, 6, '#222', '#000', 1); const uP = (p.um||0)/100;
   if(uP>0) rr(x-88, 528, 100*uP, 6, uP>=1?(fr%10<5?'#fff':'#ffeb3b'):'#00e5ff');
   if(uP>=1) tx('ULT READY', x-38, 531, 7, '#fff');
  }
 });
 if(fr<120&&S=='game')tx('FIGHT!',500,200,40+Math.sin(fr/4)*3,'#fff','#000',12)}

// ---------- loop ----------
function frame(now){acc+=Math.min(100,now-last);last=now;
 while(acc>=16.67){acc-=16.67;if(S=='game')step();else{fr++;shake*=.88;if(S=='menu')menuInput()}}
 if(S=='menu')drawMenu();
 else{drawGame();if(S=='over'){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
  tx(win?win.ch.n+' WINS!':'DRAW',500,240+Math.sin(fr/10)*6,44,win?win.ch.c:'#fff','#000',12);tx('ENTER / CLICK FOR MENU',500,310,16,'#fff','#000',6)}}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
